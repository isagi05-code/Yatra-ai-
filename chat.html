<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatra.AI - Intelligent Travel Agent</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF for Itinerary Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="chat-page-body">

    <!-- Background Layer (Static for chat page) -->
    <div class="bg-layer active"
        style="background-image: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80'); filter: blur(8px) brightness(0.3);">
    </div>
    <div class="bg-gradient-overlay" style="background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.7));">
    </div>

    <div class="container chat-container">
        <!-- Header / Navigation -->
        <header>
            <div class="logo">
                <img src="yatralogo.jpg" alt="Yatra.AI Logo" class="brand-logo">
                <span>Yatra.AI</span>
            </div>

            <nav>
                <ul class="nav-links">
                    <li><a href="/index.html">HOME</a></li>
                    <li><a href="/holidays.html">HOLIDAYS</a></li>
                    <li><a href="/chat.html" class="active">AI AGENT</a></li>
                    <li><a href="/companion.html">TRAVEL COMPANION</a></li>
                    <li><a href="/dashboard.html">CHAT HISTORY</a></li>
                </ul>
            </nav>

            <div class="nav-icons">
                <button class="icon-btn search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                <a href="/signin.html"><button class="icon-btn user-btn"><i class="fa-solid fa-user"></i></button></a>
            </div>
        </header>

        <!-- Main Chat UI -->
        <!-- Main Chat UI -->
        <main class="chat-main modern-ai-layout">
            <div class="chat-wrapper">

                <div class="top-actions">
                    <button id="downloadPdfBtn" class="premium-btn ghost-btn pdf-float-btn" style="display: none;">
                        <i class="fa-solid fa-file-pdf"></i> Download Itinerary
                    </button>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="empty-state-greeting" id="emptyStateGreeting">
                        <div class="hero-logo-sphere">
                            <img src="yatralogo.jpg" alt="Yatra Logo">
                        </div>
                        <h1 class="hero-greeting">HELLO, YATRI!!</h1>
                        <h2 class="hero-subgreeting">I can help you perfectly to create your next global escape.</h2>
                    </div>
                </div>

                <div class="chat-bottom-section">
                    <div class="chat-input-wrapper">
                        <button class="icon-btn attachment-btn"><i class="fa-solid fa-paperclip"></i></button>

                        <input type="text" id="chatInput" placeholder="Message AI Chat..." autocomplete="off">

                        <button class="icon-btn voice-btn"><i class="fa-solid fa-microphone"></i></button>
                        <button class="premium-btn action-btn text-white" id="sendBtn">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="chat.js"></script>
    <script src="auth_check.js"></script>
</body>

</html>
